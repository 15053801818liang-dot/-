name: Windows security regression tests

on:
  pull_request:
    paths:
      - 'YBLLMStreamSystem/**'
      - '.github/workflows/windows-security-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-security:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite for the isolated native tests
        run: vcpkg install sqlite3:x64-windows
      - name: Configure
        run: cmake -S YBLLMStreamSystem -B build/windows-security -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
      - name: Compile including Windows TBS adapter
        run: cmake --build build/windows-security --config ${{ matrix.configuration }}
      - name: Test codec and temporary SQLite files (no TPM commands)
        run: ctest --test-dir build/windows-security -C ${{ matrix.configuration }} --output-on-failure --no-tests=error
